[package]
name = "codeburn-rs"
version = "0.1.0"
edition = "2021"
description = "Local AI coding spend from Claude, Codex, and Cursor session files"
license = "MIT"
publish = false

[[bin]]
name = "codeburn-rs"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
